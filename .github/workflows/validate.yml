name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # hassfest tightens its rules with new Home Assistant releases; the weekly
  # run catches that even when nothing is committed.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job names are what branch protection lists as required checks — keep them
  # stable.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: hacs
    runs-on: ubuntu-latest
    steps:
      # Validates the repository on GitHub (description, topics, brand icon,
      # hacs.json, manifest), so it needs no checkout.
      - uses: hacs/action@main
        with:
          category: integration

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Home Assistant 2025.2, the minimum in hacs.json, runs on 3.13.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
